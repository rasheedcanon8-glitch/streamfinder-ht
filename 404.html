<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable (404) – StreamFinder</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <script>
    // Redirection automatique après 8 secondes
    let n = 8;
    window.addEventListener('load', () => {
      const el = document.getElementById('n');
      const iv = setInterval(() => {
        n--;
        if (el) el.textContent = n;
        if (n <= 0) { clearInterval(iv); window.location.href = './index.html'; }
      }, 1000);
    });
  </script>
  <style>
    :root {
      --blue: #1E40AF; --blue-light: #EFF6FF; --blue-200: #BFDBFE;
      --text: #1E293B; --mid: #475569; --white: #fff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 50%, #BFDBFE 100%);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      color: var(--text);
    }
    .card {
      background: var(--white); border-radius: 24px; padding: 56px 48px;
      max-width: 520px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(30,64,175,.18);
      border: 2px solid rgba(30,64,175,.1);
      animation: up .5s cubic-bezier(.4,0,.2,1);
    }
    @keyframes up { from{opacity:0;transform:translateY(32px);} to{opacity:1;transform:translateY(0);} }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .logo-icon {
      width: 38px; height: 38px; background: var(--blue); color: #fff;
      border-radius: 8px; font-size: 1rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-size: 1.3rem; font-weight: 800; color: var(--text); letter-spacing: -.03em; }
    .logo-accent { color: var(--blue); }
    .code {
      font-size: clamp(5rem, 18vw, 9rem); font-weight: 900; line-height: 1;
      letter-spacing: -.06em;
      background: linear-gradient(135deg, var(--blue), #3B82F6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 12px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.72;} }
    .emoji { font-size: 3rem; margin-bottom: 14px; display: block; }
    h1 { font-size: 1.55rem; font-weight: 900; color: var(--text); margin-bottom: 12px; letter-spacing: -.02em; }
    .desc { font-size: .95rem; color: var(--mid); line-height: 1.7; margin-bottom: 28px; }
    .countdown-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue-light); border: 1.5px solid var(--blue-200);
      border-radius: 9999px; padding: 8px 20px;
      font-size: .85rem; color: var(--blue); font-weight: 600; margin-bottom: 24px;
    }
    .n-badge {
      width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: .85rem; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 28px; background: var(--blue); color: #fff;
      border-radius: 9999px; font-family: inherit; font-size: 1rem; font-weight: 700;
      text-decoration: none; box-shadow: 0 4px 16px rgba(30,64,175,.35);
      transition: all .25s ease; border: none; cursor: pointer;
    }
    .btn:hover { background: #1D4ED8; transform: translateY(-2px); }
    .footer { margin-top: 32px; font-size: .78rem; color: var(--mid); }
    @media(max-width:480px){ .card{ padding:36px 22px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">▶</div>
      <span class="logo-text">Stream<span class="logo-accent">Finder</span></span>
    </div>
    <div class="code" aria-label="Erreur 404">404</div>
    <span class="emoji" aria-hidden="true">🎬</span>
    <h1>Page introuvable</h1>
    <p class="desc">
      Oups ! La page que vous cherchez n'existe pas ou a été déplacée.
      Retournez à l'accueil pour continuer à découvrir où regarder vos films légalement.
    </p>
    <div class="countdown-pill" aria-live="polite">
      Redirection automatique dans <span class="n-badge" id="n">8</span> secondes
    </div>
    <a href="./index.html" class="btn" id="btn-home">🏠 Retour à l'accueil StreamFinder</a>
  </div>
  <p class="footer">© <script>document.write(new Date().getFullYear())</script> StreamFinder Haiti</p>
</body>
</html>
